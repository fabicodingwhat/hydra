<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydra</title>
<meta name="description" content="The persistence of evil and chaos. Cut one down, two take its place.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
<style>
@font-face {
  font-family: "PP Fragment Glare";
  src: url("assets/fonts/PPFragment-GlareRegular-subset.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: block;
}
:root {
  --bg: #1B1B1B;
  --ink: #7A7A7A;
  --ink-quiet: #535353;
  --groove-dark: #0A0A0A;
  --groove-light: #232323;
  --u: calc(100vw / 1728);
  --hydra-visible: min(calc(232.7 * var(--u)), 21vh);
  --head-scale: 1;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "PP Fragment Glare", "Cormorant Garamond", Georgia, serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  position: relative;
}

/* ---------- hero ---------- */
.stage {
  position: absolute;
  inset: 0 0 auto 0;
  bottom: calc(var(--hydra-visible) + 56px); /* refined in JS to the footer's top edge */
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.hero {
  position: relative;
  width: 415.51px;
  height: 541.52px;
  flex-shrink: 0;
  transform-origin: center;
}
.hero .sigil {
  position: absolute;
  left: 100px; top: 0;
  width: 232px; height: 266px;
  perspective: 1100px;
  user-select: none;
}
.sigil-3d {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  --face: 1; --side: 0.3; --back: 1;
}
.sigil-layer {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  -webkit-user-drag: none;
  backface-visibility: visible;
}
.sigil-layer.face { filter: brightness(var(--face)); backface-visibility: hidden; }
.sigil-layer.side {
  /* the slab's edge: a flat stone-coloured silhouette, so the carving isn't repeated in depth */
  background-color: #8A8986;
  background-size: 340% auto;          /* the sigil's own stone, zoomed so it reads as grain, not as a copy of the carving */
  background-position: 38% 62%;
  -webkit-mask: center / cover no-repeat;
  mask: center / cover no-repeat;
  filter: brightness(calc(var(--side) * var(--k, 1))) contrast(1.25);
}
.sigil-layer.back { filter: brightness(var(--back)); }
.hero .arc {
  position: absolute;
  left: 0; top: 333px;
  width: 415.51px; height: 208.52px;
}
.hero .head { position: absolute; left: 133.98px; top: 309px; pointer-events: auto; }

/* ---------- the button ---------- */
.head {
  appearance: none;
  border: 0;
  padding: 0 0 4px;
  margin: 0;
  width: 148px;
  height: 52px;
  border-radius: 7px;
  background: #FFFFFFB8;
  overflow: clip;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.head .base, .head .face, .head .grain { position: absolute; pointer-events: none; }
.head .base {
  left: 0; top: 4px; width: 148px; height: 49px; border-radius: 8px;
  background: linear-gradient(0deg, #050202 -5.07%, #707070 5.81%);
  background: linear-gradient(in oklab 0deg, oklab(4.6% 0.015 0.008) -5.07%, oklab(54.3% 0 0) 5.81%);
}
.head .face {
  left: 0; top: 0; width: 148px; height: 49px; border-radius: 8px;
  background: linear-gradient(180deg, #DEDEDE 0%, #A5A5A5 97.97%);
  background: linear-gradient(in oklab 180deg, oklab(89.8% 0 0) 0%, oklab(71.8% 0 0) 97.97%);
}
.head .label {
  position: relative;
  color: #464646;
  font-size: 24px;
  line-height: 1;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding-top: 3px;
  pointer-events: none;
}
.head .grain {
  left: -7.99px; top: -28.38px; width: 206px; height: 112px;
  background: url("assets/stone-texture.jpg") center / cover no-repeat;
  mix-blend-mode: hard-light;
}
.head .face, .head .label, .head .grain { transition: transform 90ms ease-out; }
.head:hover .face { filter: brightness(1.04); }
.head:active .face, .head:active .label, .head:active .grain { transform: translateY(2px); }
.head:focus-visible { outline: 1px solid #9A9A9A; outline-offset: 4px; }

/* spawned heads */
.swarm { position: absolute; inset: 0; pointer-events: none; }
.swarm .head { position: absolute; pointer-events: auto; transform: scale(var(--head-scale)); transform-origin: 0 0; }

/* crumbled head */
.piece {
  position: absolute;
  pointer-events: none;
  margin: 0;
  z-index: 5;
}
.debris {
  position: absolute;
  width: 148px; height: 52px;
  transform-origin: 0 0;
  pointer-events: none;
  z-index: 5;
}
.debris .piece { left: 0; top: 0; }
.dust { position: absolute; border-radius: 50%; pointer-events: none; }

/* ---------- footer ---------- */
.footer {
  position: absolute;
  left: 34px; right: 34px;
  bottom: calc(var(--hydra-visible) + 11px);
  display: flex;
  flex-direction: column;
  gap: 14px;
  pointer-events: none;
}
.footer .row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  color: var(--ink-quiet);
  font-size: 12px;
  line-height: 14px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.footer .row span:nth-child(2) { text-align: center; }
.footer .mark { display: inline-block; width: 0.837em; height: 1em; vertical-align: -0.2em; }
.footer .row span:nth-child(3) { text-align: right; }
.footer .groove {
  height: 1.5px;
  border-top: 0.5px solid var(--groove-light);
  border-bottom: 1px solid var(--groove-dark);
}
.hydra {
  position: absolute;
  left: calc(-0.2 * var(--u));
  top: calc(100% - var(--hydra-visible));
  width: calc(1802.7 * var(--u));
  height: auto;
  pointer-events: none;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

@media (max-width: 640px) {
  .footer { left: 20px; right: 20px; }
  .footer .row { grid-template-columns: 1fr; gap: 6px; text-align: center; }
  .footer .row span:nth-child(n) { text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
}
</style>
</head>

  <svg class="hydra" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="1802.7" height="384.4" viewBox="0 0 1802.7 384.4" fill="none"><defs><filter id="hydraDeboss" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feOffset in="SourceAlpha" dy="2"/><feGaussianBlur stdDeviation="1" result="lip"/><feComposite in="lip" in2="SourceAlpha" operator="out" result="lipEdge"/><feFlood flood-color="#FFFFFF" flood-opacity="0.06"/><feComposite in2="lipEdge" operator="in" result="lipLight"/><feOffset in="SourceAlpha" dy="14"/><feGaussianBlur stdDeviation="9" result="sh"/><feComposite in="SourceAlpha" in2="sh" operator="out" result="shEdge"/><feFlood flood-color="#000000" flood-opacity="1"/><feComposite in2="shEdge" operator="in" result="dark"/><feOffset in="SourceAlpha" dy="-3"/><feGaussianBlur stdDeviation="2" result="hl"/><feComposite in="SourceAlpha" in2="hl" operator="out" result="hlEdge"/><feFlood flood-color="#FFFFFF" flood-opacity="0.05"/><feComposite in2="hlEdge" operator="in" result="light"/><feMerge><feMergeNode in="lipLight"/><feMergeNode in="SourceGraphic"/><feMergeNode in="dark"/><feMergeNode in="light"/></feMerge></filter></defs><g filter="url(#hydraDeboss)"><path d="M20 364.4H111V362.6C93.3 351.7 91 335.8 91 303.5V197H256.6V303.5C256.6 335.8 254.3 351.7 236.6 362.6V364.4H327.6V362.6C309.8 351.7 307.6 335.8 307.6 303.5V81C307.6 46.8 309.8 32.7 327.6 21.4V20H236.6V21.4C254.3 32.7 256.6 46.8 256.6 81V173.8H91V81C91 46.8 93.3 32.7 111 21.4V20H20V21.4C37.7 32.7 40 46.8 40 81V303.5C40 335.8 37.7 351.7 20 362.6Z" fill="#141414"/><path d="M422.7 57.8 509.1 208.8V303.5C509.1 335.8 506.9 351.7 489.1 362.6V364.4H579.7V362.6C561.9 351.7 559.6 335.8 559.6 303.5V208.4L641.1 58.7C651.5 38.2 660.6 29.1 673.8 21.4V20H606V21.4C620.6 29.1 618.3 41.4 609.7 58.2L546 178.8L480.5 58.7C471.4 41.8 470.5 29.1 483.6 21.4V20H389.5V21.4C404.5 29.6 411.8 38.7 422.7 57.8Z" fill="#141414"/><path d="M735.3 364.4H866.8C990.1 364.4 1067.4 294.4 1067.4 187.4C106   <p class="sr-only" aria-live="polite" id="status"></p>

<script>
(() => {
  const swarm = document.getElementById('swarm');
  const hero = document.getElementById('hero');
  const status = document.getElementById('status');
  const footer = document.querySelector('.footer');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const W = 148, H = 52, GAP = 14, EDGE = 16;

  // Scale the hero to the room above the footer, keeping the artboard's proportions:
  // the composition fills ~66% of that height, centred, with equal air above and below.
  const stage = hero.parentElement;
  let headScale = 1;
  function fitHero() {
    const body = document.body.getBoundingClientRect();
    const footTop = footer.getBoundingClientRect().top;
    stage.style.bottom = Math.max(0, body.bottom - footTop) + 'px';
    const room = footTop - body.top;
    const s = Math.max(0.45, Math.min(room * 0.66 / 541.52, (window.innerWidth - 40) / 415.51, 1.35));
    // lift the composition ~150px (at the 1728×1117 artboard), scaled to the room available,
    // but never closer than 74px to the top edge
    const centredTop = (room - 541.52 * s) / 2;
    const lift = Math.max(0, Math.min(150 * room / 843, centredTop - 74));
    hero.style.transform = `translateY(${-lift}px) scale(${s})`;
    headScale = s;
    document.documentElement.style.setProperty('--head-scale', s.toFixed(4));
  }
  window.addEventListener('resize', fitHero);
  if (document.fonts) document.fonts.ready.then(fitHero);
  fitHero();

  function makeHead() {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'head';
    b.setAttribute('aria-label', 'Behead');
    b.innerHTML = '<span class="base"></span><span class="face"></span><span class="label">Behead</span><span class="grain"></span>';
    return b;
  }

  function occupied() {
    const rects = [...document.querySelectorAll('.head')].map(el => el.getBoundingClientRect());
    const sigil = hero.querySelector('.sigil').getBoundingClientRect();
    const arc = hero.querySelector('.arc').getBoundingClientRect();
    return rects.concat([sigil, arc]);
  }

  function overlaps(x, y, rects) {
    const w = W * headScale, h = H * headScale;
    return rects.some(r => x < r.right + GAP && x + w > r.left - GAP && y < r.bottom + GAP && y + h > r.top - GAP);
  }

  function findSpot(rects) {
    const maxX = window.innerWidth - W * headScale - EDGE;
    const maxY = footer.getBoundingClientRect().top - H * headScale - 20;
    let x, y;
    for (let i = 0; i < 400; i++) {
      x = EDGE + Math.random() * Math.max(0, maxX - EDGE);
      y = EDGE + Math.random() * Math.max(0, maxY - EDGE);
      if (!overlaps(x, y, rects)) return { x, y };
    }
    return { x, y }; // the swarm has filled the page; let them pile up
  }

  function shake() {
    const k = [
      { transform: 'translate(0,0)' }, { transform: 'translate(-3px,2px)' },
      { transform: 'translate(2px,-2px)' }, { transform: 'translate(-1px,1px)' },
      { transform: 'translate(0,0)' }
    ];
    [hero.parentElement, swarm].forEach(el => el.animate(k, { duration: 200, easing: 'linear' }));
  }

  function sever(btn) {
    const r = btn.getBoundingClientRect();
    const from = { x: r.left, y: r.top };
    if (reduce.matches) { btn.remove(); return from; }

    const scale = r.width / W;
    const debris = document.createElement('div');
    debris.className = 'debris';
    Object.assign(debris.style, { left: r.left + 'px', top: r.top + 'px', transform: `scale(${scale})` });
    document.body.appendChild(debris);

    // 1. the hammer lands: the head squashes into the ground
    const stand = btn.cloneNode(true);
    stand.className = 'head piece';
    stand.removeAttribute('aria-label');
    stand.setAttribute('aria-hidden', 'true');
    stand.tabIndex = -1;
    debris.appendChild(stand);
    btn.remove();
    stand.animate(
      [{ transform: 'none' }, { transform: 'translateY(4px) scale(1.05, 0.8)' }],
      { duration: 70, easing: 'cubic-bezier(.6,0,1,1)', fill: 'forwards' }
    ).onfinish = () => {
      shake();

      // 2. the head gives way and is gone
      stand.animate(
        [{ transform: 'translateY(4px) scale(1.05, 0.8)', opacity: 1 },
         { transform: 'translateY(6px) scale(1.08, 0.7)', opacity: 0 }],
        { duration: 160, easing: 'ease-out', fill: 'forwards' }
      ).onfinish = () => stand.remove();

      // 3. only dust is left behind
      for (let i = 0; i < 46; i++) {
        const d = document.createElement('div');
        d.className = 'dust';
        const size = 0.8 + Math.random() * 1.8;
        const x = 6 + Math.random() * (W - 12), y = 8 + Math.random() * (H - 16);
        const tone = 0x55 + Math.floor(Math.random() * 0x60);
        Object.assign(d.style, {
          left: x + 'px', top: y + 'px', width: size + 'px', height: size + 'px',
          background: `rgb(${tone},${tone},${tone})`
        });
        debris.appendChild(d);
        const drift = (x - W / 2) * (0.15 + Math.random() * 0.35) + (Math.random() * 14 - 7);
        const lift = -(4 + Math.random() * 14);
        const settle = 10 + Math.random() * 26;
        d.animate([
          { transform: 'translate(0,0)', opacity: 0 },
          { transform: `translate(${drift * 0.4}px,${lift}px)`, opacity: 0.85, offset: 0.18, easing: 'cubic-bezier(.3,0,.6,1)' },
          { transform: `translate(${drift}px,${settle}px)`, opacity: 0 }
        ], { duration: 1300 + Math.random() * 900, delay: Math.random() * 90, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
      }
      setTimeout(() => debris.remove(), 2500);
    };
    return from;
  }

  // two new heads rise in place at random open spots
  function grow(focusFirst) {
    const born = [];
    const sc = headScale;
    for (let i = 0; i < 2; i++) {
      const spot = findSpot(occupied().concat(born.map(b => b.rect)));
      const head = makeHead();
      head.style.left = (spot.x / window.innerWidth * 100) + 'vw';
      head.style.top = (spot.y / window.innerHeight * 100) + 'vh';
      swarm.appendChild(head);
      born.push({ el: head, rect: { left: spot.x, top: spot.y, right: spot.x + W * sc, bottom: spot.y + H * sc } });
      if (!reduce.matches) {
        // scale about the head's own centre (transform-origin is its top-left corner)
        const at = k => `translate(${W * sc * (1 - k) / 2}px, ${H * sc * (1 - k) / 2}px) scale(${sc * k})`;
        head.animate([
          { transform: at(0.2), opacity: 0, filter: 'blur(3px)' },
          { transform: at(1.04), opacity: 1, filter: 'blur(0px)', offset: 0.65 },
          { transform: at(1), opacity: 1, filter: 'blur(0px)' }
        ], { duration: 520, delay: 260 + i * 130, easing: 'cubic-bezier(.2,.8,.3,1)', fill: 'backwards' });
      }
    }
    if (focusFirst) born[0].el.focus({ preventScroll: true });
    const count = document.querySelectorAll('.head:not(.piece)').length;
    status.textContent = `Two heads grew back. ${count} heads remain.`;
  }

  // ---- the sigil as a carved slab: stacked copies of the artwork give it thickness ----
  const sigil = hero.querySelector('.sigil-3d');
  const front = sigil.querySelector('.face');
  const DEPTH = 22, LAYERS = 28;                 // px of stone, number of slices (sub-pixel spacing = no banding)
  for (let i = 1; i <= LAYERS; i++) {
    const isBack = i === LAYERS;
    const layer = isBack ? front.cloneNode() : document.createElement('div');
    const t = i / LAYERS;                         // 0 = just behind the face, 1 = back
    layer.className = 'sigil-layer ' + (isBack ? 'back' : 'side');
    if (!isBack) {
      layer.style.webkitMaskImage = layer.style.maskImage = `url("${front.src}")`;
      layer.style.backgroundImage = `url("${front.src}")`;
    }
    layer.style.transform = `translateZ(${-t * DEPTH}px)`;
    // edges darken toward the back, with a little slice-to-slice variation for chisel strata
    layer.style.setProperty('--k', (0.95 - t * 0.4 + (Math.random() - 0.5) * 0.14).toFixed(3));
    sigil.insertBefore(layer, sigil.firstChild);
  }
  front.style.transform = 'translateZ(0.5px)';

  // rotate about the slab's centre and light it from the front-left as it turns
  let angle = 0, target = 0, last = 0, raf = 0;
  let tiltX = 0, tiltY = 0, aimX = 0, aimY = 0;  // the lean toward a nearby cursor, in degrees
  function render() {
    const a = angle + tiltY;
    const r = a * Math.PI / 180;
    sigil.style.transform = `translateZ(${DEPTH / 2}px) rotateX(${tiltX}deg) rotateY(${a}deg) translateZ(${-DEPTH / 2}px)`;
    // light comes from the viewer: whichever face turns toward you is fully lit,
    // with only a slight falloff as it angles away
    const facing = Math.cos(r);
    sigil.style.setProperty('--face', (0.7 + 0.3 * Math.max(0, facing)).toFixed(3));
    sigil.style.setProperty('--back', (0.7 + 0.3 * Math.max(0, -facing)).toFixed(3));
    sigil.style.setProperty('--side', (0.24 + 0.22 * Math.abs(Math.sin(r))).toFixed(3));
  }
  function tick(now) {
    const dt = Math.min(64, now - (last || now)); last = now;
    angle += (target - angle) * (1 - Math.exp(-dt / 280));
    const lean = 1 - Math.exp(-dt / 160);
    tiltX += (aimX - tiltX) * lean;
    tiltY += (aimY - tiltY) * lean;
    if (Math.abs(target - angle) < 0.05 && Math.abs(aimX - tiltX) < 0.05 && Math.abs(aimY - tiltY) < 0.05) {
      angle = target = target % 360; tiltX = aimX; tiltY = aimY;
      render(); raf = 0; last = 0; return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }
  render();

  // within 100px of the sigil, the slab turns slightly to face the cursor
  const sigilBox = hero.querySelector('.sigil');
  const NEAR = 100, LEAN = 12;                    // px of reach, max degrees of turn
  function aim(x, y) {
    aimX = aimY = 0;
    if (x != null && !reduce.matches) {
      const b = sigilBox.getBoundingClientRect();
      const dx = Math.max(b.left - x, 0, x - b.right), dy = Math.max(b.top - y, 0, y - b.bottom);
      if (Math.hypot(dx, dy) <= NEAR) {
        const clamp = v => Math.max(-1, Math.min(1, v));
        const nx = clamp((x - (b.left + b.right) / 2) / (b.width / 2 + NEAR));
        const ny = clamp((y - (b.top + b.bottom) / 2) / (b.height / 2 + NEAR));
        aimY = nx * LEAN;
        aimX = -ny * LEAN;
      }
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  document.addEventListener('pointermove', e => aim(e.clientX, e.clientY));
  document.addEventListener('pointerout', e => { if (!e.relatedTarget) aim(); });  // cursor left the window

  document.addEventListener('click', e => {
    const btn = e.target.closest('.head');
    if (!btn || btn.classList.contains('piece')) return;
    const keyboard = e.detail === 0;
    sever(btn);
    grow(keyboard);
    // the sigil turns a full revolution with every head taken; rapid clicks stack up
    if (!reduce.matches) {
      target += 360;
      if (!raf) raf = requestAnimationFrame(tick);
    }
  });
})();
</script>
